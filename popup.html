<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles/common.css" />
    <link rel="stylesheet" href="styles/popup.css" />
  </head>
  <body>
    <div class="header">
      <div class="header-text">
        <h1>GET笔记超级助手</h1>
        <p>订阅更新、视频播客一键提交转录、批量下载导出，支持 Obsidian</p>
      </div>
      <div class="header-actions">
        <div class="header-menu">
          <button
            class="btn-menu"
            id="btnHeaderMenu"
            title="更多"
            aria-label="更多"
            aria-haspopup="true"
            aria-expanded="false"
          >&#8942;</button>
          <div class="header-menu-dropdown" id="headerMenuDropdown" role="menu">
            <button class="header-menu-item" id="btnSettings" type="button" role="menuitem">设置</button>
            <a class="header-menu-item" href="welcome.html" target="_blank" rel="noreferrer" role="menuitem">关于</a>
            <a class="header-menu-item" href="https://biji.tonomes.com/help.html" target="_blank" rel="noreferrer" role="menuitem">帮助</a>
          </div>
        </div>
      </div>
    </div>
    <div class="update-bar" id="updateBar" style="display:none">
      <span class="update-text" id="updateText"></span>
      <div class="update-actions">
        <a class="update-btn-go" id="updateGo" href="#" target="_blank" rel="noreferrer">去更新</a>
        <button class="update-btn-dismiss" id="updateDismiss" title="忽略此版本">&#10005;</button>
      </div>
    </div>
    <div class="tab-bar">
      <button class="tab-btn active" data-tab="export">笔记导出</button>
      <button class="tab-btn" data-tab="subs">订阅管理</button>
    </div>
    <div class="tab-panel active" id="panelExport">
    <div class="body">
      <!-- Step 1: Fetch notes -->
      <div class="step-label"><span class="step-num">1</span> 获取笔记</div>
      <div class="fetch-row">
        <button class="btn btn-primary" id="btnFetchAll">获取全部笔记</button>
        <button class="btn btn-danger" id="btnCancelFetch" style="display:none">取消</button>
      </div>
      <div id="fetchStatus"></div>

      <!-- Note count + list -->
      <div class="note-count-bar" id="noteCountBar">
        <span>已捕获 <span class="count" id="noteCount">0</span> 条笔记<span
            class="new-badge" id="newBadge"></span></span>
        <label class="select-all-label">
          <input type="checkbox" id="selectAll" /> 全选
        </label>
      </div>
      <div id="noteList" class="note-list"></div>
      <button class="btn-manage-all" id="btnManageAll" style="display:none">管理全部笔记</button>

      <hr class="section-divider" />

      <!-- Step 2: Export -->
      <div class="step-label"><span class="step-num">2</span> 导出</div>

      <div class="file-format-label">文件格式</div>
      <div class="file-format-toggle" id="fileFormatToggle">
        <label class="file-fmt-check active">
          <input type="checkbox" data-format="md" checked /> MD
        </label>
        <label class="file-fmt-check"> <input type="checkbox" data-format="pdf" /> PDF </label>
        <label class="file-fmt-check"> <input type="checkbox" data-format="docx" /> DOCX </label>
      </div>

      <div class="format-toggle" id="formatToggle">
        <button class="fmt-btn active" id="fmtZipBtn" data-format="zip">ZIP 下载</button>
        <button class="fmt-btn" id="fmtVaultBtn" data-format="vault">Obsidian仓库</button>
      </div>

      <div class="vault-inline" id="vaultInline">
        <span class="v-dot" id="vaultDot"></span>
        <span class="v-label" id="vaultLabel">Obsidian仓库: 未配置</span>
        <a href="#" class="v-link" id="openSettings">设置</a>
      </div>

      <button class="btn btn-primary btn-full" id="btnExport">导出全部笔记</button>
      <button class="btn-export-new" id="btnExportNew">仅导出新增笔记</button>

      <!-- Progress -->
      <div class="progress" id="progress">
        <div class="pbar"><div class="pfill" id="pfill"></div></div>
        <div class="ptxt" id="ptxt"></div>
      </div>

      <!-- Advanced options (collapsed) -->
      <button class="advanced-toggle" id="advancedToggle">
        <span class="arrow">&#9654;</span> 开发模式
      </button>
      <div class="advanced-content" id="advancedContent">
        <div class="adv-row">
          <button class="btn btn-secondary" id="btnScan">扫描 Vue Store</button>
          <button class="btn btn-danger" id="btnClear">清空数据</button>
        </div>
        <div class="adv-row">
          <button class="btn btn-secondary" id="btnClearExport">清除导出记录</button>
        </div>
        <label>
          <input type="checkbox" id="discoveryToggle" />
          Discovery 模式（在控制台记录 API 响应）
        </label>
      </div>

      <div class="tip" id="tip">打开 biji.com 并浏览笔记，插件会自动捕获数据。</div>
    </div>
    </div><!-- /panelExport -->

    <div class="tab-panel" id="panelSubs">
    <div class="body">
      <div class="subs-toolbar">
        <button class="btn btn-primary" id="btnRefreshFeeds">刷新</button>
        <span id="subsRefreshStatus"></span>
        <select id="subsStatusFilter">
          <option value="">全部</option>
          <option value="new">未提交</option>
          <option value="submitted">已提交</option>
        </select>
        <a href="#" id="btnOpenSubsPage">管理订阅</a>
      </div>

      <div class="subs-batch-bar">
        <label><input type="checkbox" id="subsSelectAll"> 全选</label>
        <span class="sel-count" id="subsSelCount">已选 0 条</span>
        <button class="btn btn-primary" id="btnSubmitSelected" disabled>提交选中</button>
      </div>

      <div class="subs-list" id="subsList"></div>
      <div class="subs-status" id="subsStatus"></div>

      <!-- Subs progress -->
      <div class="progress" id="subsProgress">
        <div class="pbar"><div class="pfill" id="subsPfill"></div></div>
        <div class="ptxt" id="subsPtxt"></div>
      </div>
    </div>
    </div><!-- /panelSubs -->

    <script src="lib/jszip.min.js"></script>
    <script src="lib/FileSaver.min.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
