<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Biji to Obsidian — 订阅管理</title>
  <link rel="stylesheet" href="styles/common.css" />
  <link rel="stylesheet" href="styles/subscriptions.css" />
  <link rel="stylesheet" href="nav-shared.css" />
</head>
<body class="page-body">
  <nav class="nav-tab-bar">
    <div class="nav-tab-bar-inner">
      <a class="nav-tab" href="notes.html">笔记管理</a>
      <a class="nav-tab active" href="subscriptions.html">订阅管理</a>
      <a class="nav-tab" href="options.html">设置</a>
    </div>
  </nav>

  <div class="container">
    <!-- Channel strip -->
    <div class="channel-strip" id="channelStrip"></div>

    <!-- Management panel (hidden by default) -->
    <div class="manage-panel" id="managePanel">
      <h2>订阅源管理</h2>
      <div id="feedList"></div>
      <div class="feed-add-row">
        <input type="text" id="feedUrl" class="feed-add-input" placeholder="RSS / YouTube 频道 / 播客 RSS URL">
        <input type="text" id="feedName" class="feed-add-input" placeholder="名称（可选）">
        <button id="btnAddFeed">添加</button>
      </div>
      <div id="feedAddStatus"></div>
      <details class="opml-details">
        <summary class="opml-summary">OPML 批量导入</summary>
        <div class="opml-inner">
          <input type="file" id="opmlFile" accept=".opml,.xml">
          <button id="btnImportOpml">导入</button>
          <span id="opmlStatus"></span>
        </div>
      </details>
    </div>

    <!-- Filter bar -->
    <div class="filter-bar">
      <input type="text" id="searchInput" placeholder="搜索标题...">
      <select id="filterType">
        <option value="">全部类型</option>
        <option value="youtube">YouTube</option>
        <option value="podcast">播客</option>
        <option value="bilibili">B站</option>
        <option value="other">其他</option>
      </select>
      <select id="filterStatus">
        <option value="">全部状态</option>
        <option value="new">未提交</option>
        <option value="submitted">已提交</option>
      </select>
      <select id="filterDate">
        <option value="">全部日期</option>
        <option value="7">近7天</option>
        <option value="30">近30天</option>
        <option value="90">近90天</option>
      </select>
      <button class="btn-refresh" id="btnRefreshAll">刷新</button>
    </div>

    <!-- Content list -->
    <div class="content-card">
      <div id="contentList"></div>
    </div>

    <!-- Pagination -->
    <div class="pagination">
      <button id="btnPrev" disabled>&laquo; 上一页</button>
      <span class="page-info" id="pageInfo">第 1 页</span>
      <button id="btnNext" disabled>下一页 &raquo;</button>
    </div>
  </div>

  <!-- Batch bar (fixed bottom) -->
  <div class="batch-bar" id="batchBar">
    <div class="batch-bar-inner">
      <label class="select-all-label">
        <input type="checkbox" id="pageSelectAll"> 全选
      </label>
      <span class="sel-count" id="pageSelCount">已选 0 条</span>
      <button class="btn-batch" id="btnBatchSubmit" disabled>提交选中</button>
    </div>
    <div class="batch-progress" id="batchProgress">
      <div class="bar-track">
        <div class="bar-fill" id="batchPfill"></div>
      </div>
      <div class="bar-text" id="batchPtxt"></div>
    </div>
  </div>

  <script src="subscriptions.js"></script>
</body>
</html>
