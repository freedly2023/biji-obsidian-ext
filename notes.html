<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Biji to Obsidian — 笔记管理</title>
    <link rel="stylesheet" href="styles/common.css" />
    <link rel="stylesheet" href="styles/notes.css" />
    <link rel="stylesheet" href="nav-shared.css" />
  </head>
  <body class="page-body">
    <nav class="nav-tab-bar">
      <div class="nav-tab-bar-inner">
        <a class="nav-tab active" href="notes.html">笔记管理</a>
        <a class="nav-tab" href="subscriptions.html">订阅管理</a>
        <a class="nav-tab" href="options.html">设置</a>
        <a class="nav-tab" href="welcome.html">关于</a>
        <a class="nav-tab" href="help.html">帮助</a>
      </div>
    </nav>

    <div class="container">
      <!-- Search & Filter -->
      <div class="card">
        <div class="filter-row">
          <input
            type="text" class="search-input" id="searchInput"
            placeholder="搜索标题 / 标签..."
          />
        </div>
        <div class="filter-row">
          <label>类型:</label>
          <div class="multi-select" id="filterType">
            <button class="multi-select-trigger" type="button">全部</button>
            <div class="multi-select-dropdown"></div>
          </div>

          <label>日期:</label>
          <input type="date" class="date-input" id="dateFrom" />
          <span class="date-separator">~</span>
          <input type="date" class="date-input" id="dateTo" />

          <label>状态:</label>
          <select class="filter-select" id="filterExport">
            <option value="all">全部</option>
            <option value="exported">已导出</option>
            <option value="unexported">未导出</option>
          </select>

          <label>排序:</label>
          <select class="filter-select" id="filterSort">
            <option value="date_desc">最新优先</option>
            <option value="date_asc">最早优先</option>
            <option value="title">按标题</option>
            <option value="type">按类型</option>
          </select>
        </div>
      </div>

      <!-- Batch operations -->
      <div class="card">
        <div class="batch-bar">
          <label> <input type="checkbox" id="selectAll" /> 全选 </label>
          <span class="sel-info"
            >已选 <strong id="selCount">0</strong> 条 / 共
            <strong id="totalCount">0</strong> 条</span
          >
        </div>

        <div class="export-row">
          <div class="fmt-group" id="fmtGroup">
            <span class="fmt-label">格式:</span>
            <label class="fmt-check-sm active">
              <input type="checkbox" data-format="md" checked /> MD
            </label>
            <label class="fmt-check-sm"> <input type="checkbox" data-format="pdf" /> PDF </label>
            <label class="fmt-check-sm"> <input type="checkbox" data-format="docx" /> DOCX </label>
          </div>
          <div class="method-group">
            <button class="method-btn-sm active" id="methodZip" data-method="zip">ZIP 下载</button>
            <button class="method-btn-sm" id="methodVault" data-method="vault">Vault</button>
          </div>
          <button class="btn btn-primary btn-sm" id="btnExport">导出选中笔记</button>
        </div>

        <div class="progress" id="progress">
          <div class="pbar"><div class="pfill" id="pfill"></div></div>
          <div class="ptxt" id="ptxt"></div>
        </div>
      </div>

      <!-- Note list table -->
      <div class="card" id="noteListCard">
        <table class="note-table" id="noteTable">
          <thead>
            <tr>
              <th class="col-checkbox"></th>
              <th class="col-status"></th>
              <th>标题</th>
              <th class="col-type">类型</th>
              <th class="col-date">日期</th>
              <th>标签</th>
            </tr>
          </thead>
          <tbody id="noteTableBody"></tbody>
        </table>

        <div class="empty-state" id="emptyState" style="display:none">暂无匹配的笔记</div>

        <div class="pagination" id="pagination">
          <button id="btnPrev" disabled>上一页</button>
          <span class="page-info" id="pageInfo">第 0/0 页</span>
          <button id="btnNext" disabled>下一页</button>
        </div>
      </div>
    </div>

    <script src="lib/jszip.min.js"></script>
    <script src="lib/FileSaver.min.js"></script>
    <script src="lib/html2pdf.bundle.min.js"></script>
    <script src="lib/docx.min.js"></script>
    <script src="notes.js"></script>
  </body>
</html>
