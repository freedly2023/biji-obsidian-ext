<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Biji to Obsidian — 笔记管理</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
        font-size: 14px;
        color: #333;
        background: #f5f5f7;
        min-height: 100vh;
      }

      .container {
        max-width: 800px;
        margin: 24px auto;
        padding: 0 20px;
      }

      .card {
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        padding: 20px;
        margin-bottom: 16px;
      }
      .card h2 {
        font-size: 15px;
        font-weight: 600;
        color: #6c5ce7;
        margin-bottom: 14px;
        padding-bottom: 8px;
        border-bottom: 2px solid #f0eef9;
      }

      /* Search & Filter */
      .filter-row {
        display: flex;
        gap: 10px;
        margin-bottom: 10px;
        align-items: center;
        flex-wrap: wrap;
      }
      .filter-row label {
        font-size: 12px;
        color: #666;
        font-weight: 500;
        flex-shrink: 0;
      }
      .search-input {
        flex: 1;
        min-width: 200px;
        padding: 8px 12px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 13px;
        font-family: inherit;
        transition: border-color 0.2s;
      }
      .search-input:focus {
        outline: none;
        border-color: #6c5ce7;
        box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.1);
      }
      .filter-select {
        padding: 6px 10px;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-size: 12px;
        font-family: inherit;
        background: #fff;
      }
      .filter-select:focus {
        outline: none;
        border-color: #6c5ce7;
      }
      .date-input {
        padding: 6px 10px;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-size: 12px;
        font-family: inherit;
      }
      .date-input:focus {
        outline: none;
        border-color: #6c5ce7;
      }

      /* Batch bar */
      .batch-bar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 0;
        flex-wrap: wrap;
      }
      .batch-bar label {
        display: flex;
        align-items: center;
        gap: 4px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 500;
      }
      .batch-bar input[type='checkbox'] {
        accent-color: #6c5ce7;
        width: 16px;
        height: 16px;
      }
      .batch-bar .sel-info {
        font-size: 12px;
        color: #888;
      }
      .batch-bar .sel-info strong {
        color: #6c5ce7;
      }

      /* File format toggle */
      .fmt-group {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .fmt-group .fmt-label {
        font-size: 11px;
        color: #888;
      }
      .fmt-check-sm {
        padding: 4px 10px;
        border: 2px solid #e9ecef;
        border-radius: 5px;
        background: #fff;
        cursor: pointer;
        font-size: 11px;
        font-weight: 600;
        color: #666;
        transition: all 0.2s;
        display: inline-flex;
        align-items: center;
        gap: 3px;
      }
      .fmt-check-sm input[type='checkbox'] {
        accent-color: #6c5ce7;
        cursor: pointer;
      }
      .fmt-check-sm.active {
        border-color: #6c5ce7;
        background: #f8f7fd;
        color: #6c5ce7;
      }
      .fmt-check-sm:hover:not(.active) {
        border-color: #c4bbf0;
      }

      /* Export method toggle */
      .method-group {
        display: flex;
        gap: 4px;
        align-items: center;
        margin-left: 8px;
      }
      .method-btn-sm {
        padding: 4px 10px;
        border: 1px solid #e9ecef;
        border-radius: 5px;
        background: #fff;
        cursor: pointer;
        font-size: 11px;
        font-weight: 500;
        color: #666;
        transition: all 0.2s;
      }
      .method-btn-sm.active {
        background: #eee;
        color: #333;
        font-weight: 600;
      }
      .method-btn-sm:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      .btn {
        padding: 8px 16px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 500;
        font-family: inherit;
        transition: opacity 0.2s;
      }
      .btn:hover {
        opacity: 0.85;
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .btn-primary {
        background: #6c5ce7;
        color: #fff;
      }
      .btn-sm {
        padding: 6px 12px;
        font-size: 12px;
      }

      .export-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 10px;
        flex-wrap: wrap;
      }

      /* Progress */
      .progress {
        display: none;
        margin-top: 10px;
      }
      .progress.active {
        display: block;
      }
      .pbar {
        height: 6px;
        background: #e9ecef;
        border-radius: 3px;
        overflow: hidden;
      }
      .pfill {
        height: 100%;
        background: #6c5ce7;
        border-radius: 3px;
        width: 0;
        transition: width 0.3s;
      }
      .ptxt {
        font-size: 12px;
        color: #666;
        margin-top: 4px;
        text-align: center;
      }

      /* Note table */
      .note-table {
        width: 100%;
        border-collapse: collapse;
      }
      .note-table th {
        text-align: left;
        padding: 8px 10px;
        font-size: 12px;
        color: #888;
        font-weight: 500;
        border-bottom: 2px solid #f0eef9;
      }
      .note-table td {
        padding: 10px 10px;
        font-size: 13px;
        border-bottom: 1px solid #f5f5f5;
        vertical-align: middle;
      }
      .note-table tr:hover td {
        background: #fafafe;
      }
      .note-table input[type='checkbox'] {
        accent-color: #6c5ce7;
        width: 15px;
        height: 15px;
        cursor: pointer;
      }
      .note-title-cell {
        max-width: 300px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .note-title-cell a {
        color: #333;
        text-decoration: none;
      }
      .note-title-cell a:hover {
        color: #6c5ce7;
      }

      /* Type badges */
      .type-badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 10px;
        font-size: 11px;
        font-weight: 600;
      }
      .type-badge.voice {
        background: #fff3e0;
        color: #e67e22;
      }
      .type-badge.text {
        background: #e3f2fd;
        color: #2196f3;
      }
      .type-badge.link {
        background: #e8f5e9;
        color: #4caf50;
      }
      .type-badge.other {
        background: #f5f5f5;
        color: #999;
      }

      /* Export status */
      .export-status {
        font-size: 12px;
      }
      .export-status.new {
        color: #e74c3c;
        font-weight: 600;
      }
      .export-status.exported {
        color: #aaa;
      }

      /* Tags */
      .tag-list {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
      }
      .tag-chip {
        display: inline-block;
        padding: 1px 6px;
        border-radius: 4px;
        font-size: 10px;
        background: #f0eef9;
        color: #6c5ce7;
      }

      /* Pagination */
      .pagination {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        padding: 16px 0;
      }
      .pagination button {
        padding: 6px 14px;
        border: 1px solid #ddd;
        border-radius: 6px;
        background: #fff;
        cursor: pointer;
        font-size: 12px;
        font-family: inherit;
        transition: all 0.2s;
      }
      .pagination button:hover:not(:disabled) {
        border-color: #6c5ce7;
        color: #6c5ce7;
      }
      .pagination button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .pagination .page-info {
        font-size: 12px;
        color: #888;
      }

      .empty-state {
        text-align: center;
        padding: 40px;
        color: #999;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <link rel="stylesheet" href="nav-shared.css" />
    <nav class="nav-tab-bar">
      <div class="nav-tab-bar-inner">
        <a class="nav-tab active" href="notes.html">笔记管理</a>
        <a class="nav-tab" href="subscriptions.html">订阅管理</a>
        <a class="nav-tab" href="options.html">设置</a>
      </div>
    </nav>

    <div class="container">
      <!-- Search & Filter -->
      <div class="card">
        <div class="filter-row">
          <input
            type="text"
            class="search-input"
            id="searchInput"
            placeholder="搜索标题 / 标签..."
          />
        </div>
        <div class="filter-row">
          <label>类型:</label>
          <select class="filter-select" id="filterType">
            <option value="all">全部</option>
            <option value="voice">语音</option>
            <option value="text">文字</option>
            <option value="link">链接</option>
          </select>

          <label>日期:</label>
          <input type="date" class="date-input" id="dateFrom" />
          <span style="font-size: 12px; color: #888">~</span>
          <input type="date" class="date-input" id="dateTo" />

          <label>状态:</label>
          <select class="filter-select" id="filterExport">
            <option value="all">全部</option>
            <option value="exported">已导出</option>
            <option value="unexported">未导出</option>
          </select>

          <label>排序:</label>
          <select class="filter-select" id="filterSort">
            <option value="date_desc">最新优先</option>
            <option value="date_asc">最早优先</option>
            <option value="title">按标题</option>
            <option value="type">按类型</option>
          </select>
        </div>
      </div>

      <!-- Batch operations -->
      <div class="card">
        <div class="batch-bar">
          <label> <input type="checkbox" id="selectAll" /> 全选 </label>
          <span class="sel-info"
            >已选 <strong id="selCount">0</strong> 条 / 共
            <strong id="totalCount">0</strong> 条</span
          >
        </div>

        <div class="export-row">
          <div class="fmt-group" id="fmtGroup">
            <span class="fmt-label">格式:</span>
            <label class="fmt-check-sm active">
              <input type="checkbox" data-format="md" checked /> MD
            </label>
            <label class="fmt-check-sm"> <input type="checkbox" data-format="pdf" /> PDF </label>
            <label class="fmt-check-sm"> <input type="checkbox" data-format="docx" /> DOCX </label>
          </div>
          <div class="method-group">
            <button class="method-btn-sm active" id="methodZip" data-method="zip">ZIP 下载</button>
            <button class="method-btn-sm" id="methodVault" data-method="vault">Vault</button>
          </div>
          <button class="btn btn-primary btn-sm" id="btnExport">导出选中笔记</button>
        </div>

        <div class="progress" id="progress">
          <div class="pbar"><div class="pfill" id="pfill"></div></div>
          <div class="ptxt" id="ptxt"></div>
        </div>
      </div>

      <!-- Note list table -->
      <div class="card" id="noteListCard">
        <table class="note-table" id="noteTable">
          <thead>
            <tr>
              <th style="width: 30px"></th>
              <th style="width: 20px"></th>
              <th>标题</th>
              <th style="width: 60px">类型</th>
              <th style="width: 90px">日期</th>
              <th>标签</th>
            </tr>
          </thead>
          <tbody id="noteTableBody"></tbody>
        </table>

        <div class="empty-state" id="emptyState" style="display: none">暂无匹配的笔记</div>

        <div class="pagination" id="pagination">
          <button id="btnPrev" disabled>上一页</button>
          <span class="page-info" id="pageInfo">第 0/0 页</span>
          <button id="btnNext" disabled>下一页</button>
        </div>
      </div>
    </div>

    <script src="lib/jszip.min.js"></script>
    <script src="lib/FileSaver.min.js"></script>
    <script src="lib/html2pdf.bundle.min.js"></script>
    <script src="lib/docx.min.js"></script>
    <script src="vault-writer.js"></script>
    <script src="shared.js"></script>
    <script src="notes.js"></script>
  </body>
</html>
